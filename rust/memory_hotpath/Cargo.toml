[package]
name = "grokforge_memory_hotpath"
version = "0.1.0"
edition = "2021"

[lib]
name = "grokforge_memory_hotpath"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
