<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrokForge — Live Monitoring Dashboard</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #0f0f0f; color: #0f0; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #0f0; text-align: center; }
        .status { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .card { background: #1a1a1a; border: 1px solid #0f0; border-radius: 8px; padding: 15px; }
        pre { background: #111; padding: 15px; border-radius: 4px; overflow: auto; color: #0f0; }
        button { background: #0f0; color: #000; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; margin: 5px; }
        button:hover { background: #ff0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 GrokForge Production Dashboard</h1>
        <div class="status">
            <div class="card">
                <h2>Live Services</h2>
                <pre>{{ status_json }}</pre>
            </div>
        </div>
        <p style="text-align:center; margin-top:30px;">
            <button onclick="location.reload()">🔄 Refresh Status</button>
            <button onclick="fetch('/api/heal/grokforge-swarm').then(r=>r.json()).then(console.log)">Heal Swarm</button>
            <button onclick="fetch('/api/heal/grok-dream').then(r=>r.json()).then(console.log)">Heal Dream</button>
        </p>
    </div>
</body>
</html>
